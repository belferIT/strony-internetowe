site_name: Strony internetowe – INF.03
site_description: Materiały do lekcji z przedmiotu Strony internetowe (technikum, klasa I)
site_author: Marcin Wojciechowski
site_url: https://belferit.github.io/strony-internetowe/
repo_url: https://github.com/belferit/strony-internetowe

theme:
  name: material
  language: pl
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Tryb ciemny
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Tryb jasny

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.mark

nav:
  - Start: index.md
  - Rozkład materiału: rozklad.md
  - Start:
      - "1. Bezpieczna praca i konto GitHub": start/lekcja-01.md
      - "2. Jak działa WWW": start/lekcja-02.md
  - HTML:
      - "3. Struktura dokumentu HTML5": html/lekcja-03.md
      - "4. Nagłówki, akapity, formatowanie": html/lekcja-04.md
      - "5. Listy": html/lekcja-05.md
      - "6. Odnośniki i foldery": html/lekcja-06.md
      - "7. Obrazy na stronie": html/lekcja-07.md
      - "8. Grafika w GIMP": html/lekcja-08.md
      - "9. Tabele": html/lekcja-09.md
      - "10. Scalanie komórek": html/lekcja-10.md
  - CSS:
      - css/index.md
  - Projekt i publikacja:
      - projekt/index.md
  - JavaScript:
      - javascript/index.md
  - Powtórka do INF.03:
      - powtorka/index.md
