<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Flexbox – plac zabaw</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .box { border: 2px dashed #90a4ae; background: #eceff1; margin-bottom: 20px; min-height: 80px; }
        .el { width: 60px; height: 60px; background: #26a69a; color: white; font-weight: bold;
              line-height: 60px; text-align: center; border-radius: 6px; margin: 4px; }
        #C { height: 200px; }
        #F { height: 150px; }
    </style>
</head>
<body>
    <h1>Flexbox – plac zabaw</h1>
    <h2>A</h2>
    <div class="box" id="A"><div class="el">1</div><div class="el">2</div><div class="el">3</div></div>
    <h2>B</h2>
    <div class="box" id="B"><div class="el">1</div><div class="el">2</div><div class="el">3</div><div class="el">4</div></div>
    <h2>C</h2>
    <div class="box" id="C"><div class="el">1</div></div>
    <h2>D</h2>
    <div class="box" id="D"><div class="el">1</div><div class="el">2</div><div class="el">3</div></div>
    <h2>E</h2>
    <div class="box" id="E"><div class="el">1</div><div class="el">2</div><div class="el">3</div><div class="el">4</div><div class="el">5</div><div class="el">6</div><div class="el">7</div><div class="el">8</div><div class="el">9</div><div class="el">10</div></div>
    <h2>F</h2>
    <div class="box" id="F"><div class="el">1</div><div class="el">2</div><div class="el">3</div><div class="el">4</div></div>
</body>
</html>
