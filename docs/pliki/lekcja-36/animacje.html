<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Animacje CSS</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; }
        section { margin-bottom: 40px; }
        .przycisk { display: inline-block; padding: 12px 24px; background: #ff9800; color: white;
                    text-decoration: none; border-radius: 6px; }
        .karta { width: 200px; padding: 20px; background: #e8eaf6; border-radius: 10px; }
        .ikona, .serce { display: inline-block; font-size: 48px; }
    </style>
</head>
<body>
    <h1 class="wjazd">Animacje CSS</h1>

    <section>
        <h2>1. Przycisk</h2>
        <a href="#" class="przycisk">Zapisz się</a>
    </section>

    <section>
        <h2>2. Karta</h2>
        <div class="karta">Najedź na mnie!</div>
    </section>

    <section>
        <h2>3. Ikona</h2>
        <span class="ikona">⚙️</span>
    </section>

    <section>
        <h2>4. Serce</h2>
        <span class="serce">❤️</span>
    </section>

    <section>
        <h2>5. Ładowanie</h2>
        <div class="ladowanie"></div>
    </section>
</body>
</html>
